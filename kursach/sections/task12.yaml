id: task12
title: 'Задача 12. Моделирование Бюффона'
numbered: true
body:
  - type: paragraph
    text: |
      Реализована классическая задача Бюффона о бросании иглы на плоскость с
      параллельными линиями. Методом Монте-Карло оценивается вероятность
      пересечения иглой линии.

subsections:

  - id: task12_implementation
    title: "Ядро симуляции"
    numbered: true
    body:
      - type: paragraph
        text: |
          Класс {{code:NeedleSimulation}} реализует одно бросание иглы и
          пакетный запуск.

      - type: listing
        id: lst.simulation_class
        language: C++
        caption: 'Класс NeedleSimulation'
        content: |
          struct NeedleResult {
              double x;
              double phi;
              bool crosses;
          };

          class NeedleSimulation {
          public:
              NeedleSimulation(double d, double L);
              NeedleResult run_single();
              std::vector<NeedleResult> run_batch(int n);
          private:
              double m_d, m_L;
              std::mt19937 m_rng;
              std::uniform_real_distribution<double> m_dist_x;
              std::uniform_real_distribution<double> m_dist_phi;
          };

      - type: listing
        id: lst.task12_run_single
        language: C++
        caption: 'Метод run\_single() — одно бросание иглы'
        content: |
          NeedleResult NeedleSimulation::run_single() {
              double x   = m_dist_x(m_rng);
              double phi = m_dist_phi(m_rng);
              bool crosses = x <= (m_L / 2.0) * std::sin(phi);
              return {x, phi, crosses};
          }

  - id: task12_analytical
    title: "Аналитический вывод вероятности пересечения"
    numbered: true
    body:
      - type: paragraph
        text: |
          Рассмотрим классический вывод вероятности пересечения иглой линии
          в задаче Бюффона. Пусть $d$ — расстояние между параллельными линиями,
          $L$ — длина иглы ($L \le d$). Положение иглы характеризуется двумя
          независимыми случайными величинами:

      - type: list
        ordered: false
        items:
          - '$x$ — расстояние от середины иглы до ближайшей линии, $x \sim U(0, d/2)$;'
          - '$\varphi$ — острый угол между иглой и линией, $\varphi \sim U(0, \pi/2)$.'

      - type: paragraph
        text: |
          Игла пересекает линию, если проекция её половины на вертикаль не
          меньше расстояния до линии:

      - type: formula
        id: eq.buffon_condition
        content: |-
          x \le \frac{L}{2} \sin \varphi

      - type: paragraph
        text: |
          Вероятность пересечения есть отношение площади области, удовлетворяющей
          условию, к площади всего прямоугольника $[0, d/2] \times [0, \pi/2]$
          в пространстве параметров $(x, \varphi)$:

      - type: formula
        id: eq.buffon_integral
        content: |-
          P_{\text{cross}} = \frac{1}{\frac{d}{2} \cdot \frac{\pi}{2}}
          \iint\limits_{x \le \frac{L}{2}\sin\varphi} dx\,d\varphi
          = \frac{4}{\pi d} \int_{0}^{\pi/2} \frac{L}{2} \sin\varphi \, d\varphi

      - type: formula
        id: eq.buffon_result
        content: |-
          P_{\text{cross}} = \frac{2L}{\pi d} \int_{0}^{\pi/2} \sin\varphi \, d\varphi
          = \frac{2L}{\pi d}

      - type: paragraph
        text: |
          Таким образом, точная вероятность пересечения линии иглой Бюффона
          равна $2L/(\pi d)$. Этот результат позволяет не только верифицировать
          стохастическое моделирование, но и оценивать число $\pi$ методом
          Монте-Карло: $\hat{\pi} \approx 2L / (d \cdot \hat{P}_{\text{cross}})$.

  - id: task12_gui
    title: "Графический интерфейс"
    numbered: true
    body:
      - type: paragraph
        text: |
          Приложение построено на Qt6 Quick и предоставляет два режима работы.

      - type: paragraph
        text: |
          {{bold:Пакетный режим.}} Пользователь задаёт число бросаний $N$
          (100–100 000) и запускает симуляцию. Отображаются: общее число
          бросков, число пересечений, эмпирическая вероятность
          $\hat{P}_{\text{cross}}$, точная вероятность $P_{\text{cross}}$
          и абсолютная ошибка.

      - type: paragraph
        text: |
          {{bold:Визуальный режим.}} Каждая игла отображается на холсте:
          пересекающие линии иглы окрашиваются красным, не пересекающие —
          фиолетовым. Доступна легенда и счётчик пересечений для текущего
          кадра.

      - type: paragraph
        text: |
          Управление параметрами осуществляется ползунками: $d$ (расстояние
          между линиями), $L$ (длина иглы, $L \le d$), $N$ (число бросаний).

      - type: figure_group
        id: fig.task12_results
        caption: "Интерфейс приложения и визуализация бросаний иглы"
        layout: vertical
        figures:
          - path: "assets/task12_gui.png"
            subcaption: "Интерфейс приложения в пакетном режиме"
            width: 0.8

          - path: "assets/task12_visual.png"
            subcaption: "Визуальный режим: пересекающие (красные) и не пересекающие (фиолетовые) иглы"
            width: 0.8
      - type: page_break
