id: task13
title: "Задача 13. Статистический анализ случайных графов"
numbered: true
body:
  - type: paragraph
    text: |
      Разработана программа для генерации случайных взвешенных графов и
      вычисления набора графовых характеристик методом Монте-Карло. Для
      эффективной работы с памятью реализована многоуровневая система
      аллокаторов.

subsections:

  - id: task13_model
    title: "Математическая модель"
    numbered: true
    body:
      - type: paragraph
        text: |
          Генерируется неориентированный взвешенный граф $G = (V, E)$
          с $|V| = n$ вершинами. Для каждой пары $(i,j)$ независимо:

      - type: formula
        id: eq.graph_generation
        content: |-
          P(e_{ij} \neq 0) = d, \quad w_{ij} \sim U\{1, 2, \ldots, L\}

      - type: paragraph
        text: |
          где $d$ — плотность графа, $L$ — максимальный вес ребра.
          Вес $w_{ij} = 0$ означает отсутствие ребра.

      - type: paragraph
        text: |
          Для каждого сгенерированного графа вычисляются следующие
          характеристики:

      - type: table
        id: tbl.metrics
        caption: "Характеристики случайного графа"
        columns: ["Метрика", "Обозначение", "Алгоритм", "Сложность"]
        rows:
          - ['Вес MST', '$\text{MST}(G)$', 'Прима', '$O(n^2)$']
          - ['Длина цикла (макс.)', '$\|C_{\max}\|$', 'DFS (исчерп.)', '$O(n!)$']
          - ['Вес цикла (макс.)', '$W(C_{\max})$', 'DFS (исчерп.)', '$O(n!)$']
          - ['Изолированные вершины', '$I(G)$', 'Перебор', '$O(n^2)$']
          - ['Число остовных деревьев', '$\tau(G)$', 'Кирхгоф + Барейсс', '$O(n^3)$']
          - ['Компоненты связности', '$C_c(G)$', 'BFS', '$O(n^2)$']
          - ['Кликовые компоненты', '$K_c(G)$', 'BFS + проверка', '$O(n^2 + m)$']

      - type: paragraph
        text: |
          {{bold:Вес минимального остовного дерева (MST).}} Вычисляется
          алгоритмом Прима за $O(n^2)$:

      - type: formula
        id: eq.mst
        content: '\text{MST}(G) = \sum_{v \in V} \min_{u \in S, (u,v) \in E} w(u,v)'

      - type: paragraph
        text: |
          где $S$ — множество уже включённых в MST вершин. Алгоритм поддерживает
          массив {{code:key[v]}} — минимальный вес ребра, соединяющего $v$
          с текущим MST, и массив {{code:in\_mst[v]}} — флаг включения вершины.

      - type: listing
        id: lst.prim_mst
        language: C++
        caption: 'Алгоритм Прима для вычисления веса MST'
        content: |
          i32 mst_weight(const Graph& g) {
            i32 n = g.n;
            if (n <= 1) return 0;

            constexpr i32 kInf = std::numeric_limits<i32>::max();
            i32 key[n];    bool in_mst[n];
            for (i32 i = 0; i < n; i++) {
              key[i] = kInf;   in_mst[i] = false;
            }
            key[0] = 0;

            i32 total = 0;
            for (i32 iter = 0; iter < n; iter++) {
              i32 u = -1;
              for (i32 v = 0; v < n; v++)
                if (!in_mst[v] && (u == -1 || key[v] < key[u]))
                  u = v;

              if (key[u] == kInf) break;
              in_mst[u] = true;
              total += key[u];

            for (i32 v = 0; v < n; v++) {
              if (!in_mst[v] && edge_exists(g, u, v)) {
                i32 w = static_cast<i32>(edge_weight(g, u, v));
                if (w < key[v]) key[v] = w;
              }
            }
            }
            return total;
          }

      - type: paragraph
        text: |
          Граф хранится в виде сжатой верхне-треугольной матрицы смежности:
          рёбра $E = \{w_{ij} \mid 0 \le i < j < n\}$ упакованы в
          {{code:std::span<u8>}}, доступ по {{code:edge\_index(n,i,j)}} за $O(1)$.
          Нулевой вес означает отсутствие ребра.

      - type: paragraph
        text: |
          {{bold:Число остовных деревьев.}} Вычисляется по матричной теореме
          Кирхгофа: число остовных деревьев $\tau(G)$ равно определителю
          редуцированной матрицы Лапласа $L'$ размера $(n-1) \times (n-1)$:

      - type: formula
        id: eq.laplacian
        content: |-
          L'_{ij} = \begin{cases}
          \deg(i), & i = j, \\
          -1,      & (i,j) \in E, \\
          0,       & \text{иначе}
          \end{cases}

      - type: paragraph
        text: |
          Определитель вычисляется алгоритмом Барейсса (бесскобочное
          исключение Гаусса), который оперирует целыми числами и избегает
          накопления ошибок округления:

      - type: formula
        id: eq.bareiss
        content: |-
          a_{i,j}^{(k+1)} = \frac{a_{i,j}^{(k)} \cdot a_{k,k}^{(k)}
          - a_{i,k}^{(k)} \cdot a_{k,j}^{(k)}}{a_{k-1,k-1}^{(k-1)}}

      - type: listing
        id: lst.bareiss
        language: C++
        caption: 'Алгоритм Барейсса: определитель редуцированной матрицы Лапласа'
        content: |
          i64 count_spanning_trees(const Graph& g) {
            i32 n = g.n;
            if (n <= 1) return 1;

            i32 m = n - 1;
            std::vector<std::vector<i64>> a(m, std::vector<i64>(m, 0));

            // reduced Laplacian matrix
            for (i32 i = 0; i < m; i++) {
              i64 degree = 0;
              for (i32 k = 0; k < n; k++)
                if (k != i && edge_exists(g, i, k))
                  degree++;

              a[i][i] = degree;

              for (i32 j = 0; j < m; j++) {
                if (i == j) continue;
                a[i][j] = edge_exists(g, i, j) ? -1 : 0;
              }
            }

            i64 prev = 1;
            for (i32 k = 0; k < m; k++) {
              if (a[k][k] == 0) return 0;        // graph is disconnected

              for (i32 i = k + 1; i < m; i++)
                for (i32 j = k + 1; j < m; j++)
                  a[i][j] = (a[i][j] * a[k][k] -
                             a[i][k] * a[k][j]) / prev;

              prev = a[k][k];
            }
            return a[m - 1][m - 1];
          }

      - type: paragraph
        text: |
          {{bold:Статистическое агрегирование.}} По результатам $N$ испытаний
          вычисляются выборочные средние и дисперсии для каждой метрики:

      - type: formula
        id: eq.stats
        content: '\bar{x} = \frac{1}{N}\sum_{k=1}^{N} x_k, \qquad
          \hat{\sigma}^2 = \frac{1}{N}\sum_{k=1}^{N} x_k^2 - \bar{x}^2'

  - id: task13_implementation
    title: "Программная реализация"
    numbered: true
    body:
      - type: paragraph
        text: |
          Приложение принимает на вход JSON-файл конфигурации и имя выходного
          файла. Симуляция выполняется в несколько потоков.

      - type: listing
        id: lst.task13_config_json
        language: C++
        caption: 'Пример конфигурационного файла config.json'
        content: |
          {
              "n":              10,
              "edge_length":    10,
              "graph_density":  0.99,
              "seed":           14527346871,
              "precision":      "extreme",
              "metrics": {
                  "mst_weight":          true,
                  "longest_cycle_edges": true,
                  "heaviest_cycle_edges":true,
                  "isolated_vertices":   true,
                  "spanning_trees":      true,
                  "connected_components":true,
                  "clique_components":   true
              }
          }

      - type: paragraph
        text: |
          {{bold:Параллельная симуляция.}} Каждый поток имеет собственный
          генератор случайных чисел и собственный аренный аллокатор, что
          исключает необходимость синхронизации при записи результатов.

      - type: listing
        id: lst.simulator
        language: C++
        caption: 'run\_trials\_range --- испытание в одном потоке'
        content: |
          static void run_trials_range(
              i32 start, i32 end,
              const SimulatorConfig& config,
              Accum* accums,
              std::mutex* mu,
              std::atomic<i32>* progress)
          {
            OSMemory os;   os.init();
            VirtualHeap heap;   heap.init(os, kHeapSize);
            ArenaAllocator arena;   arena.init(heap.take(kHeapSize));
            ArenaResource res(&arena);

            std::mt19937 rng(config.seed ^ start);
            Accum local[kMetricCount];

            for (i32 trial = start; trial < end; trial++) {
              auto mark = arena.save();

              Graph g = make_graph(arena, config.n);
              generate_graph(g, rng, config.edge_length,
                             config.graph_density);

              const AdjList* adj_ptr = nullptr;
              AdjList adj(0, std::pmr::vector<AdjNode>(&res), &res);
              if (needs_adj(config.metrics)) {
                adj = make_adj_list(g, &res);
                adj_ptr = &adj;
              }

              CycleStats cycle_stats{};
              if (needs_cycle(config.metrics))
                cycle_stats = find_cycle_stats(g);

              if (config.metrics[static_cast<int>(Metric::kMstWeight)])
                local[static_cast<int>(Metric::kMstWeight)].add(
                    static_cast<double>(mst_weight(g)));
              if (config.metrics[static_cast<int>(Metric::kLongestCycleEdges)])
                local[static_cast<int>(Metric::kLongestCycleEdges)].add(
                    static_cast<double>(cycle_stats.longest_by_edges));
              if (config.metrics[static_cast<int>(Metric::kHeaviestCycleEdges)])
                local[static_cast<int>(Metric::kHeaviestCycleEdges)].add(
                    static_cast<double>(cycle_stats.edge_count_of_heaviest));
              if (config.metrics[static_cast<int>(Metric::kIsolatedVertices)])
                local[static_cast<int>(Metric::kIsolatedVertices)].add(
                    static_cast<double>(count_isolated_vertices(g)));
              if (config.metrics[static_cast<int>(Metric::kSpanningTrees)])
                local[static_cast<int>(Metric::kSpanningTrees)].add(
                    static_cast<double>(count_spanning_trees(g)));
              if (config.metrics[static_cast<int>(Metric::kConnectedComponents)])
                local[static_cast<int>(Metric::kConnectedComponents)].add(
                    static_cast<double>(count_connected_components(*adj_ptr)));
              if (config.metrics[static_cast<int>(Metric::kCliqueComponents)])
                local[static_cast<int>(Metric::kCliqueComponents)].add(
                    static_cast<double>(count_clique_components(g, *adj_ptr)));

              arena.restore(mark);
              progress->fetch_add(1, std::memory_order_relaxed);
            }

            {
              std::lock_guard lock(*mu);
              for (i32 m = 0; m < kMetricCount; m++) {
                accums[m].sum += local[m].sum;
                accums[m].sum_sq += local[m].sum_sq;
                accums[m].count += local[m].count;
              }
            }

            arena.destroy();
            heap.destroy();
            os.destroy();
          }

      - type: listing
        id: lst.simulator_main
        language: C++
        caption: 'run\_simulation --- создание потоков'
        content: |
          SimulatorResult run_simulation(const SimulatorConfig& config) {
            i32 trials = precision_to_trials(config.precision);
            i32 hw_threads = static_cast<i32>(
                std::thread::hardware_concurrency());
            i32 num_threads = hw_threads < 1 ? 1 : hw_threads;

            bool any_metric = false;
            for (i32 m = 0; m < kMetricCount; m++)
              if (config.metrics[m]) { any_metric = true; break; }

            SimulatorResult result{};
            if (!any_metric) return result;

            Accum accums[kMetricCount];
            std::mutex mu;
            std::atomic<i32> progress{0};
            std::atomic<bool> prog_done{false};
            std::thread prog_thread(progress_thread_fn,
                &progress, &prog_done, trials);

            if (num_threads == 1) {
              run_trials_range(0, trials, config,
                               accums, &mu, &progress);
            } else {
              std::vector<std::thread> threads;
              threads.reserve(num_threads);

              i32 chunk = trials / num_threads;
              i32 rem = trials % num_threads;
              i32 offset = 0;

              for (i32 t = 0; t < num_threads; t++) {
                i32 count = chunk + (t < rem ? 1 : 0);
                threads.emplace_back(run_trials_range,
                    offset, offset + count,
                    std::cref(config), accums, &mu, &progress);
                offset += count;
              }
              for (auto& th : threads) th.join();
            }

            prog_done.store(true, std::memory_order_relaxed);
            prog_thread.join();

            for (i32 m = 0; m < kMetricCount; m++) {
              if (config.metrics[m]) {
                result.results[m] = accums[m].finalize();
                result.computed[m] = true;
              }
            }
            return result;
          }

      - type: paragraph
        text: |
          {{bold:Система аллокаторов.}} Реализована многоуровневая иерархия
          управления памятью:
          \begin{enumerate}
            \item {{code:OSMemory}} — резервирование/фиксация виртуальной
                  памяти через {{code:mmap}};
            \item {{code:VirtualHeap}} — резервирование непрерывного диапазона
                  адресов с автоматической фиксацией страниц;
            \item {{code:ArenaAllocator}} — линейный аллокатор с сохранением
                  и восстановлением состояния (стекинг);
            \item {{code:ArenaResource}} — адаптер {{code:std::pmr::memory\_resource}}
                  для использования с PMR-контейнерами.
          \end{enumerate}
          Аренная модель позволяет освободить всю память, выделенную за
          испытание, одной операцией {{code:restore()}}, что исключает
          фрагментацию и ускоряет повторяющиеся выделения.

      - type: listing
        id: lst.arena_allocator
        language: C++
        caption: 'Интерфейс аренного аллокатора (bump allocator)'
        content: |
          class ArenaAllocator final {
          public:
            void init(MemoryBlock block);

            void* push(usize size, usize align);  // allocate memory
            void  reset();                         // reset to start

            struct Marker { usize offset; };
            Marker save() const;                   // save position
            void   restore(Marker m);              // restore to position
          private:
            void*  m_base;    // block base
            usize  m_size;    // total size
            usize  m_offset;  // current offset
          };

          // RAII wrapper: save/restore in ctor/dtor
          struct ScopeArena final {
            ArenaAllocator*       arena;
            ArenaAllocator::Marker tag;

            ScopeArena(ArenaAllocator* a)
              : arena(a), tag(a->save()) {}
            ~ScopeArena() { arena->restore(tag); }
          };

      - type: figure
        id: fig.task13_console
        path: "assets/task13.png"
        caption: "Результат статистического анализа случайного графа"
        width: 0.9
      - type: page_break
