id: theory
title: "Теоретические основы вероятностного моделирования"
numbered: true
subsections:

  - id: theory_distributions
    title: "Законы распределения случайных величин"
    numbered: true
    body:
      - type: paragraph
        text: |
          Во всех задачах работы моделирование основано на генерации значений
          случайных величин с заданными законами распределения. Ниже приведены
          распределения, используемые в программной реализации.

      - type: paragraph
        text: "{{bold:Дискретное равномерное распределение.}}"

      - type: formula
        id: eq.uniform_discrete
        content: 'P(X = x_i) = \frac{1}{n}, \quad i = 1, \ldots, n'

      - type: paragraph
        text: |
          Случайная величина принимает $n$ значений с равными вероятностями.
          Применяется для равновероятного выбора элементов из конечного
          множества: выбор символа из алфавита (задача~1), выбор направления
          блуждания (задачи~4,~6,~7), выбор монеты (задача~10), равномерное
          распределение положения и угла иглы (задача~12).

      - type: paragraph
        text: "{{bold:Схема Бернулли и биномиальное распределение.}}"

      - type: formula
        id: eq.binomial
        content: 'P(X = k) = \binom{n}{k} p^{k} (1-p)^{n-k}, \quad k = 0, \ldots, n'

      - type: paragraph
        text: |
          Биномиальное распределение моделирует число успехов в $n$ независимых
          испытаниях Бернулли с вероятностью успеха $p$. Используется в задаче~8
          (число попаданий при обстреле бочки) и как один из законов распределения
          шага блуждания в задачах~4,~6,~7. Частный случай $n = 1$ —
          распределение Бернулли — применяется в задачах~2,~8,~10 для
          моделирования бинарных случайных событий (заражение, попадание, орёл).

      - type: paragraph
        text: "{{bold:Усечённое геометрическое распределение.}}"

      - type: formula
        id: eq.geometric_truncated
        content: 'P(X = k) = \frac{p(1-p)^k}{\sum_{i=0}^{n-1} p(1-p)^i}, \quad k = 0, \ldots, n-1'

      - type: paragraph
        text: |
          Геометрическое распределение описывает число неудач до первого успеха.
          В работе используется его усечённая версия (конечный носитель) для
          генерации значений шага блуждания с убывающей вероятностью в
          задачах~4,~6,~7.

      - type: paragraph
        text: "{{bold:Дискретное треугольное распределение.}}"

      - type: formula
        id: eq.triangular
        content: |-
          P(X = x_k) \propto \begin{cases}
          \dfrac{2(x_k - a)}{(c-a)(b-a)}, & a \le x_k \le b, \\[6pt]
          \dfrac{2(c - x_k)}{(c-a)(c-b)}, & b \le x_k \le c
          \end{cases}

      - type: paragraph
        text: |
          Треугольное распределение применяется в задачах~4,~6,~7 как один из
          законов для генерации шага или направления. Непрерывное треугольное
          распределение $\operatorname{Tri}(a,b,c)$ дискретизируется
          округлением до ближайшего допустимого значения.

      - type: paragraph
        text: "{{bold:Непрерывное равномерное распределение.}}"

      - type: formula
        id: eq.uniform_continuous
        content: 'f(x) = \frac{1}{b-a}, \quad x \in [a, b]'

      - type: paragraph
        text: |
          Непрерывное равномерное распределение задаётся плотностью
          вероятности, постоянной на отрезке $[a, b]$. Величина
          $U \sim U(0,1)$ является базовой для генерации всех остальных
          распределений, поскольку любое преобразование случайной величины
          $U$ даёт новую случайную величину с заданным законом. В работе
          $U(0,1)$ используется в задаче~5 для генерации символов кластера
          по заданному распределению на алфавите.

  - id: theory_monte_carlo
    title: "Метод Монте-Карло и закон больших чисел"
    numbered: true
    body:
      - type: paragraph
        text: |
          Метод Монте-Карло — численный метод, основанный на многократной
          реализации случайного процесса с последующим статистическим
          усреднением. В работе метод применяется для эмпирической оценки
          вероятностей событий, допускающих стохастическое моделирование.

      - type: paragraph
        text: |
          Пусть $\nu_n$ — число появлений события $A$ в $n$ независимых
          испытаниях, и $p = P(A)$ — теоретическая вероятность. Согласно
          {{bold:теореме Бернулли}} (форме закона больших чисел), для
          любого $\varepsilon > 0$:

      - type: formula
        id: eq.bernoulli_lln
        content: |-
          \lim_{n \to \infty} P\!\left( \left| \frac{\nu_n}{n} - p \right| < \varepsilon \right) = 1

      - type: paragraph
        text: |
          Относительная частота $\hat{p}_n = \nu_n / n$ сходится по
          вероятности к $p$ при росте числа испытаний. Это
          фундаментальное утверждение оправдывает применение метода
          Монте-Карло: чем больше экспериментов проведено, тем точнее
          эмпирическая оценка.

      - type: paragraph
        text: |
          Количественную оценку скорости сходимости даёт
          {{bold:неравенство Чебышёва}}:

      - type: formula
        id: eq.chebyshev
        content: |-
          P\!\left( \left| \frac{\nu_n}{n} - p \right| \ge \varepsilon \right) \le \frac{p(1-p)}{n\varepsilon^2}

      - type: paragraph
        text: |
          Неравенство показывает, что вероятность отклонения частоты от
          истинного значения убывает обратно пропорционально $n$:
          для гарантии малой ошибки $\varepsilon$ требуется $O(1/\varepsilon^2)$
          испытаний.

  - id: theory_clt
    title: "Центральная предельная теорема и доверительные интервалы"
    numbered: true
    body:
      - type: paragraph
        text: |
          Неравенство Чебышёва даёт грубую оценку. Для более точной
          характеристики погрешности используется {{bold:центральная
          предельная теорема}} (ЦПТ). Для схемы Бернулли случайная
          величина $\nu_n$ имеет биномиальное распределение, и ЦПТ
          утверждает:

      - type: formula
        id: eq.clt
        content: |-
          \frac{\nu_n - np}{\sqrt{np(1-p)}} \xrightarrow{d} N(0, 1)

      - type: paragraph
        text: |
          Нормированная частота асимптотически нормальна. Это позволяет
          построить {{bold:доверительный интервал}} для неизвестной
          вероятности $p$:

      - type: formula
        id: eq.confidence_interval
        content: |-
          \hat{p} \pm z_{\alpha/2} \sqrt{\frac{\hat{p}(1-\hat{p})}{n}}

      - type: paragraph
        text: |
          где $\hat{p} = \nu_n / n$ — эмпирическая вероятность,
          $z_{\alpha/2}$ — квантиль стандартного нормального распределения.
          Для доверительной вероятности $95\%$ ($\alpha = 0{,}05$)
          $z_{0{,}025} \approx 1{,}96$.

      - type: paragraph
        text: |
          Полуширина доверительного интервала убывает как
          $\Delta \propto 1/\sqrt{n}$, что означает: для увеличения
          точности на порядок необходимо увеличить число испытаний
          в 100 раз. Эта оценка используется во всех задачах для
          характеризации точности полученных эмпирических вероятностей.

      - type: paragraph
        text: |
          В настоящей работе для всех вычислительных экспериментов
          указывается $95\%$-й доверительный интервал (где применимо),
          что позволяет объективно судить о сходимости эмпирических
          частот к теоретическим значениям и сравнивать точность
          различных оценок.
      - type: page_break
